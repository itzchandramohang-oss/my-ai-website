<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | My Website</title>
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .contact-form {
      display: grid;
      gap: 1rem;
      max-width: 560px;
      margin-top: 1.5rem;
    }

    .contact-form label {
      display: grid;
      gap: 0.5rem;
      font-weight: 600;
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 0.5rem;
      font: inherit;
    }

    .contact-form button {
      width: fit-content;
      padding: 0.8rem 1.2rem;
      border: none;
      border-radius: 0.5rem;
      background: var(--color-primary);
      color: var(--color-white);
      cursor: pointer;
    }

    .form-status {
      min-height: 1.5rem;
      margin-top: 0.5rem;
      color: var(--color-muted);
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="../index.html">My Website</a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="../index.html">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="contact.html">Contact</a>
      <a href="../index.html#assistant">AI Assistant</a>
    </nav>
  </header>

  <main class="content-section">
    <h1>Contact Us</h1>
    <p>Email us at <a href="mailto:hello@example.com">hello@example.com</a>.</p>

    <form id="contact-form" class="contact-form" method="post">
      <label>
        Name
        <input name="name" type="text" placeholder="Your name" required>
      </label>

      <label>
        Email
        <input name="email" type="email" placeholder="you@example.com" required>
      </label>

      <label>
        Message
        <textarea name="message" rows="5" placeholder="How can we help?" required></textarea>
      </label>

      <button type="submit">Send Message</button>
      <p id="form-status" class="form-status" aria-live="polite"></p>
    </form>
  </main>

  <footer class="site-footer">
    <p>&copy; My Website</p>
  </footer>

  <script src="../js/contact.js" defer></script>
</body>
</html>
